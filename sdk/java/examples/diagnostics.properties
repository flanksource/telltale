# All paths are on the target JVM host.
# Callers present an RS256 JWT: iss must equal issuer, aud must contain audience,
# and scope must grant jvm:read / jvm:trace / jvm:instrument / jvm:eval / jvm:write per route.
issuer=https://telltale.example.com
audience=example-application
# One of jwks (inline JWKS JSON) or jwksFile (absolute path), and/or jwksUrl.
jwksFile=/var/lib/telltale/jwks.json
#jwksUrl=https://telltale.example.com/.well-known/jwks.json
runtimeDir=/var/lib/telltale/runtime
extensionsDir=/var/lib/telltale/extensions
allowMutation=false
