loader.tomcat.type=org.apache.catalina.loader.WebappClassLoaderBase
loader.tomcat.retiredStates=STOPPING_PREP,STOPPING,STOPPED,DESTROYING,DESTROYED,FAILED
compatibility=Exact Instrumenter method descriptors and extraction anchors are checked before arming; original contexts, sampling decisions, providers, and exporters are preserved. Hook counts describe installed boundaries, not complete provider coverage.
capability.spans.requires=An already initialized compatible OTel SDK SpanExporter; mirroring copies the original sampled export data and keeps the existing exporter pipeline.
capability.spans.layouts=Manual OTel SDK and official OTel Java agent shaded SDK; unsupported exporter or Instrumenter ABI fails capture arming.
capability.http.libraries=Servlet/filter APIs, JDK URLConnection/HttpClient, Apache classic/async clients, OkHttp, Spring MVC/WebFlux, RestTemplate/RestClient/WebClient and HTTP service interfaces.
capability.http.fixtureVersions=Servlet javax/jakarta; Spring 5.3.39/6.2.14/7.0.10; Apache 4.5.14/4.1.5/5.2.3; OkHttp 3.14.9/4.12.0.
capability.http.lifecycle=Response-body completion and cancellation retain each subscription's body, direction, route and host policy; top profiles sample active operations.
capability.sql.libraries=JDBC Statement/PreparedStatement/CallableStatement/batches and R2DBC through the target application's reactive APIs; Spring JDBC/ORM/Data paths reuse those driver boundaries.
capability.sql.fixtureVersions=H2 JDBC 2.3.232; R2DBC H2 1.0.0.RELEASE; R2DBC proxy 1.1.7.RELEASE; Spring 5.3.39/6.2.14/7.0.10; Hibernate 5.6.15.Final.
capability.sql.limits=Prepared SQL created before attachment is unavailable unless existing instrumentation exposes it. R2DBC requires compatible Reactor in the target loader; no provider, driver, global context or Spring bean is replaced.
capability.jms.contracts=MessageProducer/QueueSender/TopicPublisher/JMSProducer send; MessageConsumer/JMSConsumer receives; MessageListener and CompletionListener dispatch; Spring templates, listener containers and JmsClient.
capability.jms.certifiedProvider=Apache Artemis 2.44.0, javax.jms 2.0 and jakarta.jms 3.1 clients.
capability.jms.certifiedSpring=5.3.39 templates, Default/Simple containers, @JmsListener/@SendTo; 6.2.14 templates and Default/Simple containers; 7.0.10 those paths plus JmsClient. Other combinations are contract-matched, not certified by hook counts.
capability.jms.opaqueProviders=Async convenience providers must expose the actual Message at a nested send/create-message or recognized dispatch boundary. Listener/FIFO guesses are forbidden; missing correlation reports incomplete metadata. Hidden/native/unmodifiable delivery without a matching modifiable dispatch boundary is uncertified.
capability.jms.bodies=Bounded text or converted String only when enabled; Object/Bytes/Stream/Map bodies report bodyUnsupported and are never deserialized or consumed.
