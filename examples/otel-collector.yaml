receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14317
      http:
        endpoint: 127.0.0.1:14318

processors:
  batch:
    send_batch_size: 512
    send_batch_max_size: 512
    timeout: 1s

exporters:
  otlphttp/telltale:
    endpoint: http://localhost:4318
    compression: gzip
  otlp/telltale:
    endpoint: localhost:4317
    compression: gzip
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/telltale]
