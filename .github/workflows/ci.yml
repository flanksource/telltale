name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: ${{ github.workspace }}/go.work.ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: flanksource/deps@v1.0.49
        with:
          tools: |
            task
            rhysd/actionlint
      - run: make setup
      - run: make build
      - run: task java:test
      - run: .bin/telltale --version
      - uses: flanksource/gavel@c5d04cc61316c8a3147aa5141c01df1a7465f69d # v0.0.67
        with:
          version: v0.0.54
          args: test --framework go,ginkgo,vitest --timeout 20m
          comment: "false"
          artifact-name: telltale-tests
      - run: make lint

  java-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: ./sdk/java/gradlew -p sdk/java test shadowJar

  release:
    needs: [quality, java-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      source: ${{ github.sha }}
