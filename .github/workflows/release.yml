name: Release

on:
  workflow_call:
    inputs:
      source:
        description: Exact main revision that passed CI
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: ${{ github.workspace }}/go.work.ci
      SOURCE_SHA: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: flanksource/deps@v1.0.48
        with:
          tools: |
            task
      - name: Select or reuse release version
        id: version
        run: |
          echo "tag=$(bash hack/release-version.sh)" >> "$GITHUB_OUTPUT"
      - run: make setup
      - name: Build the release candidate
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: make build
      - uses: flanksource/gavel@2c08bfcf913a04f7f6adea45e362c87626d2e2fe # v0.0.62
        with:
          version: v0.0.54
          args: test --framework go,ginkgo,vitest --timeout 20m
          comment: "false"
          artifact-name: telltale-release-tests
      - name: Prepare detached release revision
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash hack/release.sh
      - name: Push SDK tags
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          while IFS= read -r module; do
            case "$module" in
              sdk/go.mod|sdk/*/go.mod) git push origin "refs/tags/${module%/go.mod}/$RELEASE_TAG" ;;
            esac
          done < <(git ls-tree -r --name-only "$RELEASE_TAG" sdk)
      - name: Verify published SDK modules and rebuild from tagged source
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GOWORK: "off"
          GOPROXY: direct
          GONOSUMDB: github.com/flanksource/telltale
          GOFLAGS: -mod=readonly
        run: |
          git checkout --detach "$RELEASE_TAG"
          make binary
          go mod verify
          .bin/telltale --version
          pnpm exec vitest run --project api
      - name: Push root version tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"
